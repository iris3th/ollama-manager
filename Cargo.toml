[package]
name = "ollama-manager"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.31"
egui = "0.31"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
base64 = "0.22"
winit = { version = "0.30", default-features = false, features = ["x11"] }
egui_commonmark = { version = "0.20", default-features = false, features = ["better_syntax_highlighting"] }
